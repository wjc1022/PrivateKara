<!doctype html><meta charset="utf-8"><title>Main worker migration</title>
<pre id="result">RUNNING</pre><iframe></iframe>
<script type="module">
// Fixture is the exact sw.js from main d136d89, not PR #9.
const checks=[], frame=document.querySelector('iframe');
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(fn,label){for(let i=0;i<400;i++){if(await fn())return;await wait(30);}throw Error('Timeout '+label);}
function check(ok,label){if(!ok)throw Error(label);checks.push(label);}
try {
 const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/',updateViaCache:'none'});
 await until(()=>navigator.serviceWorker.controller,'main controller');
 check((await caches.keys()).includes('lumen-shell-v39'),'main worker fixture installed');
 const db=await import('../src/database/db.js');
 await db.Songs.add({id:'migration-song',title:'Keep',audioBlob:new Blob(['media'])});
 await db.Lyrics.save('migration-song','[00:00]Keep');await db.Settings.set('migration-setting','keep');
 const unrelated=await caches.open('migration-unrelated');await unrelated.put('/keep',new Response('keep'));
 const old=await (await fetch('/version.json')).json();
 const latest=await (await fetch('/__publish',{method:'POST'})).json();
 // Reproduce main's reg.update() path, which has no build query parameter.
 await reg.update();await until(()=>reg.waiting,'unversioned waiting worker');
 check((await (await fetch('/version.json')).json()).build===old.build,'installation keeps main cache active before confirmation');
 const changed=new Promise(resolve=>navigator.serviceWorker.addEventListener('controllerchange',resolve,{once:true}));
 reg.waiting.postMessage({type:'SKIP_WAITING'});await changed;
 check((await (await fetch('/version.json')).json()).build===latest.build,'main confirmation activates new build through unversioned URL');
 check((await caches.keys()).includes('lumen-shell-build-'+latest.build),'migration uses build-specific shell');
 frame.src='../index.html';
 await until(()=>frame.contentDocument.querySelector('#page-home .page-head'),'new app boot');
 const moduleInFrame=path=>frame.contentWindow.eval('import('+JSON.stringify(new URL(path,frame.contentDocument.baseURI).href)+')');
 const version=await moduleInFrame('src/services/versionService.js');
 check(version.buildInfo.build===latest.build,'reloaded app identifies migrated build');
 const registration=await frame.contentWindow.navigator.serviceWorker.getRegistration();
 await until(()=>registration.waiting,'versioned registration');
 void (await moduleInFrame('src/services/updateService.js')).applyUpdateAndReload(undefined,latest);
 await until(()=>navigator.serviceWorker.controller.scriptURL.endsWith('?build='+latest.build),'versioned control');
 await until(()=>navigator.serviceWorker.controller.state==='activated','versioned activation completion');
 await until(()=>frame.contentDocument.querySelector('#page-home .page-head'),'versioned reload');
 await fetch('/__offline',{method:'POST'});frame.contentWindow.location.reload();await wait(200);
 await until(()=>frame.contentDocument.querySelector('#page-home .page-head'),'offline migrated boot');
 check((await moduleInFrame('src/services/versionService.js')).buildInfo.build===latest.build,'migrated app reopens offline');
 const saved=await moduleInFrame('src/database/db.js');
 check((await saved.Songs.withMedia('migration-song')).audioBlob.size===5,'main media preserved');
 check((await saved.Lyrics.get('migration-song')).text==='[00:00]Keep','main lyrics preserved');
 check(await saved.Settings.get('migration-setting')==='keep','main settings preserved');
 check(await (await unrelated.match('/keep')).text()==='keep','unrelated cached response preserved');
 check(!(await caches.keys()).includes('lumen-shell-migration'),'versioned activation removes migration metadata');
 const text='PASS '+checks.length+' main migration browser checks\n'+checks.join('\n');document.querySelector('#result').textContent=text;await fetch('/__result',{method:'POST',body:text});
} catch(error) {
 const keys=await caches.keys(), metadata=await caches.open('lumen-shell-migration');
 const diagnostic=JSON.stringify({keys,metadata:(await metadata.keys()).map(r=>r.url),controller:navigator.serviceWorker.controller?.scriptURL});
 const text='FAIL '+error.stack+'\n'+diagnostic+'\n'+checks.join('\n');document.querySelector('#result').textContent=text;await fetch('/__result',{method:'POST',body:text});
}
</script>
